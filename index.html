<!-- АНКЕТА -->
<section class="max-w-xl mx-auto my-16 md:my-20 section-gap" data-aos="fade-up" data-aos-duration="800" data-aos-delay="100">
    <div class="guest-card">
        <h2 class="section-title text-center mb-2">Анкета гостя</h2>
        <p class="body-text text-center text-sm text-gray-500 mb-6 sm:mb-8">Пожалуйста, подтвердите своё присутствие <strong>до 15 августа 2026</strong></p>

        <form id="guestForm" class="space-y-5 sm:space-y-6">
            <div data-aos="fade-right" data-aos-duration="500" data-aos-delay="100">
                <label class="block serif text-lg mb-2" for="name">Ваши имя и фамилия</label>
                <div class="field-group">
                    <input type="text" id="name" required class="guest-input" placeholder="Иванов Иван" />
                </div>
            </div>

            <div data-aos="fade-right" data-aos-duration="500" data-aos-delay="200">
                <span class="block serif text-lg mb-3">Сможете ли вы присутствовать?</span>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="attendance" value="Да, с удовольствием" required />
                        <span>Да, с удовольствием буду</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="attendance" value="К сожалению, не смогу" />
                        <span>К сожалению, не смогу</span>
                    </label>
                </div>
            </div>

            <!-- +1 -->
            <div data-aos="fade-right" data-aos-duration="500" data-aos-delay="300">
                <span class="block serif text-lg mb-3">Будете ли вы с +1?</span>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="plusone" value="Да" class="plusone-radio" />
                        <span>Да</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="plusone" value="Нет" class="plusone-radio" />
                        <span>Нет</span>
                    </label>
                </div>
                <div id="plusoneField" class="plusone-field">
                    <label class="block serif text-base mb-2" for="plusoneName">Имя и фамилия гостя</label>
                    <div class="field-group">
                        <input type="text" id="plusoneName" placeholder="Петров Петр" class="guest-input" />
                    </div>
                </div>
            </div>

            <!-- Напитки -->
            <div data-aos="fade-right" data-aos-duration="500" data-aos-delay="400">
                <span class="block serif text-lg mb-3">Предпочтения по напиткам (можно выбрать несколько)</span>
                <div class="drink-list">
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Вино" />
                        <span>Вино</span>
                    </label>
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Шампанское" />
                        <span>Шампанское</span>
                    </label>
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Виски" />
                        <span>Виски</span>
                    </label>
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Водка" />
                        <span>Водка</span>
                    </label>
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Безалкогольное" />
                        <span>Безалкогольное</span>
                    </label>
                    <label class="drink-checkbox">
                        <input type="checkbox" name="drinks" value="Другое" id="drinkOtherCheckbox" />
                        <span>Другое</span>
                    </label>
                </div>
                <div id="drinkOtherField" class="drink-other-field">
                    <label class="block serif text-base mb-2" for="drinkOtherInput">Укажите ваш напиток</label>
                    <div class="field-group">
                        <input type="text" id="drinkOtherInput" placeholder="Например: Мартини, Мохито..." class="guest-input" />
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-black text-white font-serif uppercase tracking-widest py-4 mt-2 hover:bg-gray-800 transition duration-300 text-xs sm:text-sm" data-aos="zoom-in" data-aos-duration="600" data-aos-delay="500">
                Отправить ответ
            </button>
        </form>
    </div>
</section>
